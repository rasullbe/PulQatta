services:
  - type: web
    name: pulqatta-api
    runtime: docker
    dockerfilePath: PulQatta/Dockerfile
    dockerContext: PulQatta
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
